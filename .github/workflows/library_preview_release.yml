name: Publish library reservation preview

on:
  push:
    branches:
      - release/library-preview-20261002
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: celechron-library-preview-20261002
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release/library-preview-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.3.1-library-preview-20261003
      RELEASE_TITLE: Celechron 1.3.1 座位与研讨间预约预览版
      APK_NAME: celechron-v1.3.1-library-preview3-universal.apk
      APP_VERSION: 1.3.1
      APP_BUILD_NUMBER: '3'

    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this preview is already published
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/library-preview-existing.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // null' > "$release_json"

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" > "$RUNNER_TEMP/library-preview-tag-commit"; then
            if [ "$(cat "$RUNNER_TEMP/library-preview-tag-commit")" != "$GITHUB_SHA" ]; then
              echo '::error::The preview tag already points to a different source commit; refusing to move or overwrite it.'
              exit 1
            fi
          fi

          if [ "$(jq -r 'type' "$release_json")" != 'null' ]; then
            echo '::error::This preview release already exists. No assets or metadata were changed. Inspect the existing release before retrying.'
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install the locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run the test suite
        run: flutter test --no-pub

      - name: Generate the Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android wrapper --gradle-version 8.13 \
            --distribution-type all \
            --gradle-distribution-url https://services.gradle.org/distributions/gradle-8.13-all.zip

      - name: Build the universal release APK with a CI test certificate
        shell: bash
        run: |
          set -euo pipefail
          # The existing release configuration uses signingConfigs.debug.
          # An isolated Android user directory makes AGP generate a new test
          # certificate without accessing the project's original signing key.
          export ANDROID_USER_HOME="$RUNNER_TEMP/library-preview-android-user"
          mkdir -p "$ANDROID_USER_HOME"
          flutter build apk --release --no-pub \
            --build-name "$APP_VERSION" --build-number "$APP_BUILD_NUMBER"

      - name: Verify and package the APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/library-preview-assets"
          mkdir -p "$release_dir"
          cp build/app/outputs/flutter-apk/app-release.apk "$release_dir/$APK_NAME"
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo '::error::Android SDK apksigner was not found.'
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$release_dir/$APK_NAME"
          cd "$release_dir"
          sha256sum "$APK_NAME" > SHA256SUMS
          sha256sum --check SHA256SUMS
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Retain the verified build as a workflow artifact
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: celechron-library-preview-apk
          path: ${{ steps.apk.outputs.release_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish the prerelease
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/library-preview-assets"
          notes_file="$RUNNER_TEMP/library-preview-release-notes.md"
          cat > "$notes_file" <<'NOTES'
          新增原生图书馆座位预约。入口：学业页 → 图书馆预约 → 座位预约。支持按馆区、楼层、日期和官网固定时段查询座位，搜索座位号及设施，确认提交、查看本人预约记录与取消预约。

          使用官网当前的 `booking.lib.zju.edu.cn` 座位入口，与研讨间复用认证实现。按服务器时间和开放规则展示可用时段，提交前重新核验区域、时段和座位；提交结果未知时不会自动重发，需先查询对应预约记录核实。

          保留原生研讨间查询、预约、本人预约记录与取消功能，并增强账号变化后的请求中止和重复提交防护。预约服务按需加载；没有增加系统权限或定时预约功能。

          当前支持普通座位。签到、暂离、签退，以及需要附件的特殊空间申请和成员邀请，请按图书馆规定通过官方渠道办理。

          此 APK 由当前源码在 GitHub Actions 中重新构建，196 项自动测试已通过，并通过 APK 签名与 SHA-256 校验。原有研讨间登录和列表已获实际使用反馈；新增座位功能尚未使用真实校园账号完成查询、预约和取消联调，预约结果请以官网记录为准。

          **安装须知：**支持 Android 9 及以上，包含 arm64-v8a、armeabi-v7a、x86_64。本预发布使用本次 CI 生成的测试签名，与原版、上一预发布及本地测试包的签名不同，不能直接覆盖安装。卸载已有版本会清除本地数据，请先导出需要保留的数据。

          版本：1.3.1+3。附件 SHA256SUMS 对应本次实际构建的 APK；请以该文件校验下载结果。
          NOTES
          printf '\n源码提交：`%s`\n\n<!-- celechron-library-preview-source:%s -->\n' "$GITHUB_SHA" "$GITHUB_SHA" >> "$notes_file"
          gh release create "$RELEASE_TAG" \
            "$release_dir/$APK_NAME" "$release_dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$notes_file" \
            --prerelease --latest=false
          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          printf 'Published preview: [%s](%s)\n' "$RELEASE_TITLE" "$release_url" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$release_dir/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
